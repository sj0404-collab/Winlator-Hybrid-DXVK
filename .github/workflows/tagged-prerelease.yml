name: Build and publish tagged developer-tools prerelease

on:
  push:
    tags:
      - 'v12.6.4-devtools.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and assemble release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare release asset and checksum
        run: |
          mkdir -p dist
          APK="Winlator-Hybrid-DXVK-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK}"
          (cd dist && sha256sum "${APK}" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Winlator-Hybrid-DXVK-${GITHUB_REF_NAME}-arm64.apk" \
            "dist/SHA256SUMS.txt" \
            --title "Winlator Hybrid DXVK ${GITHUB_REF_NAME}" \
            --notes "Optional per-container Node.js and OpenCode, folder-to-OpenCode launch, and persistent Winlator terminal sessions. Includes the optional v12.7 DXVK 1.10.3 async component. This is a prerelease from the developer-tools feature branch; PanVK/FEX/Mali compatibility is not included or claimed. Built and unit-tested by GitHub Actions." \
            --prerelease \
            --verify-tag
