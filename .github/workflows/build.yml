name: Build Winlator Hybrid DXVK APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName \"\(.*\)\"/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Winlator-Hybrid-DXVK-${VERSION}-arm64.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Hybrid-DXVK-build-${{ github.run_number }}-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
