name: Build Native Winlator Hybrid DXVK APK

on:
  push:
    branches: [ "main", "master", "v12.*" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Signed Release APK (Unified Keystore)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Signed APK Artifact
        run: |
          mkdir -p dist
          VER=$(grep -m1 -oE 'versionName "[^"]+"' app/build.gradle | sed -E 's/versionName "([0-9.]+).*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then BASE="Winlator-Hybrid-DXVK-${GITHUB_REF_NAME}-arm64-release"; else BASE="Winlator-Hybrid-DXVK-v${VER}-arm64-release"; fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${BASE}.apk"
          echo "APK_BASE=${BASE}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASE }}
          path: dist/${{ env.APK_BASE }}.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Winlator Hybrid DXVK ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/${{ env.APK_BASE }}.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
